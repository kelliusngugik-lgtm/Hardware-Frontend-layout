<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sign-style header with tape-measure ticks. Sell = shelf of price-ticket tiles beside a sale slip (bottom sheet on phones). Other tabs are full-width ledgers. */
:root{
  --bg:#E4E9E6; --surface:#F5F7F4; --surface-2:#D9E0DC; --field:#FFFFFF;
  --ink:#162127; --ink-2:#47565D; --line:#BCC7C1;
  --accent:#F2B705; --on-accent:#162127; --steel:#2B4A5E; --on-steel:#F5F7F4; --focus:#0B5CC4;
  --ok:#1B6F45; --ok-bg:#D3EADB; --warn:#9A5A06; --warn-bg:#F5E1BE; --bad:#B02A20; --bad-bg:#F4D5D1;
  --paper:#FBFBF6; --paper-ink:#1A1D1F;
  --font-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12181B; --surface:#1B2327; --surface-2:#273238; --field:#0F1518;
    --ink:#E6ECEA; --ink-2:#9CAAB0; --line:#34434B;
    --accent:#F2BE1A; --on-accent:#12181B; --steel:#5E8FAA; --on-steel:#0F1518; --focus:#F2BE1A;
    --ok:#52C58C; --ok-bg:#163826; --warn:#E8AE45; --warn-bg:#3B2D12; --bad:#F27B71; --bad-bg:#3E1A17;
    --paper:#FBFBF6; --paper-ink:#1A1D1F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12181B; --surface:#1B2327; --surface-2:#273238; --field:#0F1518;
  --ink:#E6ECEA; --ink-2:#9CAAB0; --line:#34434B;
  --accent:#F2BE1A; --on-accent:#12181B; --steel:#5E8FAA; --on-steel:#0F1518; --focus:#F2BE1A;
  --ok:#52C58C; --ok-bg:#163826; --warn:#E8AE45; --warn-bg:#3B2D12; --bad:#F27B71; --bad-bg:#3E1A17;
  --paper:#FBFBF6; --paper-ink:#1A1D1F;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-inline:16px;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;max-width:1560px;margin:0 auto;display:flex;flex-direction:column;min-width:0}
.top{flex:none;position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px 0 16px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;opacity:.4;
  background:
    repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 8px) 0 100%/100% 5px no-repeat,
    repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 40px) 0 100%/100% 9px no-repeat}
.brand{font:800 28px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.brand b{background:var(--accent);color:var(--on-accent);padding:1px 8px 0;margin-left:6px}
.brand small{display:block;margin-top:5px;font:500 12px/1.2 var(--font-body);letter-spacing:.01em;text-transform:none;color:var(--ink-2);max-width:28ch;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:4px;min-width:0;overflow-x:auto;flex:1 1 auto}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:var(--radius);font-weight:600;white-space:nowrap}
.nav button:hover{background:var(--surface-2)}
.nav button.on{background:var(--steel);color:var(--on-steel)}
.badge{margin-left:6px;background:var(--accent);color:var(--on-accent);border-radius:99px;font-size:11px;padding:1px 6px;font-weight:700}
.top-r{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap}
.cashier{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;font-weight:500}
.cashier input{width:110px;padding:4px 8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.status.live i{background:var(--ok)}
.status.demo i{background:var(--bad)}

.view{flex:1;min-height:0;padding-top:12px}
.page{height:100%;overflow:auto;padding-bottom:24px;min-width:0}
.page-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.page-h h1{font:800 30px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sum{color:var(--ink-2);margin-bottom:12px}

.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--field);border-radius:var(--radius);min-width:0}
.tools .inp{width:auto;min-width:200px}
.btn{border:1px solid var(--ink);background:transparent;padding:8px 14px;border-radius:var(--radius);font-weight:600}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn.pri{background:var(--steel);color:var(--on-steel);border-color:var(--steel)}
.btn.pri:hover:not(:disabled){filter:brightness(1.1);background:var(--steel)}
.btn.ghost{border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45}
.charge{width:100%;border:0;border-radius:var(--radius);background:var(--accent);color:var(--on-accent);font:800 24px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;padding:15px 12px}
.charge:disabled{opacity:.45}
.charge:hover:not(:disabled){filter:brightness(1.06)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-width:0}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.x{border:0;background:transparent;color:var(--ink-2);font-size:20px;line-height:1;padding:2px 8px}
.x:hover{color:var(--bad)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.ok{color:var(--ok)} .bad{color:var(--bad)} .muted{color:var(--ink-2)}

/* Sell */
.sell{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,410px);gap:16px;min-height:0}
.shelf{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}
.search{padding:11px 12px;font-size:15px}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px;overflow:auto;align-content:start;grid-auto-rows:max-content;padding:2px 2px 16px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 10px 9px;min-height:136px;min-width:0}
.tile>*{flex:none}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile:active:not(:disabled){transform:translateY(1px)}
.tile:disabled{opacity:.5}
.t-top{display:flex;justify-content:space-between;gap:6px;font:500 11px var(--font-mono);color:var(--ink-2)}
.t-name{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.t-price{display:flex;align-items:baseline;gap:5px;margin-top:auto}
.t-price b{font:800 30px/1 var(--font-display);letter-spacing:.01em}
.t-price i{font-style:normal;font-size:12px;color:var(--ink-2)}
.t-bulk{font-size:12px;color:var(--steel);font-weight:600}
.gauge{position:relative;height:6px;background:var(--surface-2);overflow:hidden}
.gauge span{display:block;height:100%;background:var(--ok)}
.gauge::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,var(--surface) 9px 10px)}
.tile.s-low .gauge span{background:var(--warn)} .tile.s-out .gauge span{background:var(--bad)}
.t-stock{font-size:12px;color:var(--ink-2)}
.tile.s-low .t-stock{color:var(--warn);font-weight:600} .tile.s-out .t-stock{color:var(--bad);font-weight:600}

.cart{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.cart-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.cart-h h2{font:800 22px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.cust-row{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
.lines{flex:1;min-height:0;overflow:auto}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 12px;border-bottom:1px dashed var(--line);align-items:center}
.l-name{font-weight:600;overflow-wrap:anywhere}
.l-sub{font-size:12px;color:var(--ink-2)}
.l-sub .tag{color:var(--steel);font-weight:600}
.l-warn{font-size:12px;color:var(--bad);font-weight:600}
.l-tot{text-align:right;font:500 14px var(--font-mono)}
.qty-box{display:inline-flex;align-items:center}
.qty-box button{width:32px;height:32px;border:1px solid var(--line);background:var(--field);font-size:16px}
.qty-box input{width:58px;height:32px;text-align:center;border:1px solid var(--line);border-left:0;border-right:0;background:var(--field);border-radius:0;padding:0}
.l-act{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.cart-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.disc{display:flex;align-items:center;gap:8px;padding:0 12px 8px}
.disc select{width:76px}.disc input{width:100px}
.sums{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sums dd{text-align:right}
.sums .tot{font:800 20px/1.2 var(--font-display);letter-spacing:.03em;text-transform:uppercase}
.cart-f{padding:0 12px 12px}
.cartbar,.cart-close{display:none}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2);display:grid;gap:12px;justify-items:center}
.empty h3{font:800 22px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.empty p{max-width:46ch}

/* Tables */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:9px 10px;border-bottom:1px solid var(--ink);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .sku{font:500 12px var(--font-mono);color:var(--ink-2)}
.tbl .acts{white-space:nowrap;text-align:right}
.tbl tr.clickable{cursor:pointer}
.tbl tr.clickable:hover td{background:var(--surface-2)}
.void-row td{opacity:.55;text-decoration:line-through}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;min-width:0}
.panel h3{font:800 16px/1 var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-variant-numeric:tabular-nums}
.kv dd{text-align:right}
.kv .strong{font-weight:700;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.scrim{position:absolute;inset:0;background:rgba(10,16,19,.6)}
.dlg{position:relative;background:var(--surface);border:1px solid var(--ink);border-radius:var(--radius);width:min(540px,100%);max-height:100%;overflow:auto;padding:16px;display:grid;gap:12px}
.dlg.wide{width:min(720px,100%)}
.dlg-h{font:800 24px/1 var(--font-display);letter-spacing:.05em;text-transform:uppercase}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.dlg-f .charge{width:auto;font-size:18px;padding:10px 18px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);min-width:0}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
label.chk input{width:auto}
.hint{font-size:13px;color:var(--ink-2)}
.err{color:var(--bad);font-weight:600;font-size:13px}
.due{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;background:var(--bg);border-radius:var(--radius)}
.due b{font:800 34px/1 var(--font-display);letter-spacing:.02em}
.paid-row{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--ink);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--field);padding:10px 4px;font-weight:600}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.4}
.payform{display:grid;gap:10px}
.paylist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.paylist b{margin-left:auto;font-variant-numeric:tabular-nums}
.heldlist li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.heldlist .grow{flex:1;min-width:0}
.paper{background:var(--paper);color:var(--paper-ink);font:12.5px/1.4 var(--font-mono);padding:14px 12px;border:1px solid var(--line);overflow-x:auto;white-space:pre;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--radius);max-width:min(92vw,520px);font-weight:500}
.toast.bad{background:var(--bad);color:#fff}
.note{font-size:13px;color:var(--ink-2);padding:10px 12px;background:var(--bg);border-radius:var(--radius)}

@media (max-width:900px){
  .sell{grid-template-columns:minmax(0,1fr)}
  .grid{padding-bottom:92px}
  .cart{position:fixed;inset:0;z-index:40;border-radius:0;border:0;visibility:hidden;transform:translateY(100%);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cart.open{visibility:visible;transform:none}
  .cart-close{display:inline-block}
  .cartbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--radius);padding:13px 16px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .cartbar b{font:800 22px/1 var(--font-display);letter-spacing:.04em}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .brand{font-size:24px}
  .top-r{margin-left:0}
}
@media (max-width:520px){
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .tools .inp{min-width:0;flex:1 1 140px}
  .page-h h1{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){
  .cart{transition:transform .22s ease,visibility .22s}
}
</style>

/* ================= data layer (shared db, or in-memory demo) ================= */
const mem={cols:{},subs:[]};
const memCol=p=>mem.cols[p]||(mem.cols[p]=new Map());
function memRows(path,where){
  let rows=[...memCol(path)].map(([id,data])=>({id,data:clean(data)}));
  if(where){const f=where[0],op=where[1],v=where[2];rows=rows.filter(r=>op==='>='?r.data[f]>=v:op==='=='?r.data[f]===v:true);}
  return rows;
}
const memNotify=p=>mem.subs.filter(s=>s.path===p).forEach(s=>s.cb(memRows(p,s.where)));
function deepMerge(t,s){
  Object.keys(s).forEach(k=>{
    const v=s[k];
    if(v&&typeof v==='object'&&!Array.isArray(v)&&t[k]&&typeof t[k]==='object'&&!Array.isArray(t[k]))deepMerge(t[k],v);
    else t[k]=v;
  });
  return t;
}
const memDB={
  sub(path,cb,where){const s={path,cb,where};mem.subs.push(s);setTimeout(()=>cb(memRows(path,where)),0);return()=>{mem.subs=mem.subs.filter(x=>x!==s);};},
  async set(p,id,d){memCol(p).set(id,clean(d));memNotify(p);},
  async update(p,id,d){const c=memCol(p);if(!c.has(id))throw {code:'invalid_argument',message:'Missing document'};deepMerge(c.get(id),clean(d));memNotify(p);},
  async del(p,id){memCol(p).delete(id);memNotify(p);},
  async get(p,id){const c=memCol(p);return c.has(id)?clean(c.get(id)):null;},
  async query(p,where){return memRows(p,where);}
};
function realDB(db){
  const col=(p,where)=>{let q=db.collection(p);if(where)q=q.where(where[0],where[1],where[2]);return q;};
  return {
    sub(path,cb,where){return col(path,where).onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,data:d.data()}))),e=>onDbError(e));},
    set:(p,id,d)=>db.collection(p).doc(id).set(d),
    update:(p,id,d)=>db.collection(p).doc(id).update(d),
    del:(p,id)=>db.collection(p).doc(id).delete(),
    async get(p,id){const s=await db.collection(p).doc(id).get();return s.exists?s.data():null;},
    async query(p,where){const s=await col(p,where).get();return s.docs.map(d=>({id:d.id,data:d.data()}));}
  };
}
let DB=memDB,unsubs=[];
const chains=new Map();
function serial(key,fn){
  const prev=chains.get(key)||Promise.resolve();
  const next=prev.catch(()=>{}).then(fn);
  chains.set(key,next);
  next.catch(()=>{}).then(()=>{if(chains.get(key)===next)chains.delete(key);});
  return next;
}
async function retry(fn){
  try{return await fn();}
  catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,400+Math.random()*400));return fn();}throw e;}
}
const W={
  set:(p,id,d)=>serial(p+'/'+id,()=>retry(()=>DB.set(p,id,clean(d)))),
  update:(p,id,d)=>serial(p+'/'+id,()=>retry(()=>DB.update(p,id,clean(d)))),
  del:(p,id)=>serial(p+'/'+id,()=>retry(()=>DB.del(p,id)))
};
function onDbError(e){
  console.error(e);
  if(e&&e.code==='revoked'){S.status='demo';toast('Your access to this shop data was withdrawn.','bad');render();}
  else toast('Lost the connection to shop data. Reload the page to reconnect.','bad');
}
function fail(e,what){

  const c=e&&e.code;
  toast(c==='quota_exceeded'?'Storage is full. Export your data and remove old records.':c==='invalid_argument'?'You do not have permission to change '+(what||'this')+'.':'Could not save '+(what||'changes')+'. Check your connection and try again.','bad');
}
function connect(impl,status){
  unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];

}

const plist=()=>Object.keys(S.products).map(id=>Object.assign({id},S.products[id])).sort((a,b)=>a.name.localeCompare(b.name));
const stockOf=p=>Number(p.stock)||0;
const stockState=p=>stockOf(p)<=0?'out':stockOf(p)<=(Number(p.reorder)||0)?'low':'ok';
const lowItems=()=>plist().filter(p=>stockState(p)!=='ok');
const tokens=q=>q.toLowerCase().split(/\s+/).filter(Boolean);
const hay=p=>(p.name+' '+p.sku+' '+(p.barcode||'')+' '+(p.cat||'')+' '+(p.bin||'')).toLowerCase();
const matches=(p,q)=>{const h=hay(p);return tokens(q).every(t=>h.includes(t));};
const creditAvail=c=>{const lim=Number(c.limit)||0;return lim>0?Math.max(0,r2(lim-(Number(c.bal)||0))):0;};

function totals(cart){
  cart=cart||S.cart;
  const rate=S.settings.vatOn?(Number(S.settings.vatRate)||0)/100:0;
  let gross=0;cart.lines.forEach(l=>{gross+=r2(l.qty*l.price);});
  gross=r2(gross);
  const d=cart.disc||{type:'amt',val:0};
  const v=Math.max(0,Number(d.val)||0);
  const disc=r2(d.type==='pct'?gross*Math.min(v,100)/100:Math.min(v,gross));
  const total=r2(gross-disc);
  const f=gross>0?total/gross:1;
  let vat=0;
  if(rate>0)cart.lines.forEach(l=>{if(l.vat)vat+=r2(l.qty*l.price)*f*rate/(1+rate);});
  return {gross,disc,total,vat:r2(vat),count:cart.lines.length};
}
function reprice(l){l.price=(l.bulkQty>0&&l.bulkPrice>0&&l.qty>=l.bulkQty)?l.bulkPrice:l.base;}
function clampQty(l){
  if(!isDec(l.unit)&&!l.custom)l.qty=Math.max(1,Math.round(l.qty));
  if(l.pid&&!S.settings.allowNeg){
    const p=S.products[l.pid];
    if(p&&l.qty>stockOf(p)){l.qty=Math.max(0,stockOf(p));toast('Only '+qtyFmt(stockOf(p))+' '+l.unit+' in stock.');}
  }
}
function addToCart(id){
  const p=S.products[id];if(!p)return;
  let l=S.cart.lines.find(x=>x.pid===id);
  if(l){l.qty=r3(l.qty+1);}
  else{l={key:uid(),pid:id,name:p.name,unit:p.unit,qty:1,base:Number(p.price)||0,price:Number(p.price)||0,bulkQty:Number(p.bulkQty)||0,bulkPrice:Number(p.bulkPrice)||0,vat:p.vat!==false,cost:Number(p.cost)||0};S.cart.lines.push(l);}
  clampQty(l);
  if(l.qty<=0){S.cart.lines=S.cart.lines.filter(x=>x!==l);}
  else reprice(l);
  render();
}
const lineByKey=k=>S.cart.lines.find(l=>l.key===k);

/* sales live in day buckets: salesdays/<date>, sales stored under s.<id> so terminals merge safely */
function salesOn(date){
  const out=[];
  const add=map=>Object.keys(map).forEach(b=>{const d=map[b];if(d&&d.date===date&&d.s)Object.keys(d.s).forEach(k=>out.push(Object.assign({},d.s[k],{_b:b})));});
  add(S.days);if(S.extra[date])add(S.extra[date]);
  return out.sort((a,b)=>b.t-a.t);
}
function findSale(id){
  let hit=null;
  const scan=map=>Object.keys(map).forEach(b=>{const d=map[b];if(d&&d.s&&d.s[id])hit=Object.assign({},d.s[id],{_b:b});});
  scan(S.days);Object.keys(S.extra).forEach(k=>scan(S.extra[k]));
  return hit;
}
function findRef(ref){
  let hit=null;
  Object.keys(S.days).forEach(b=>{const d=S.days[b];if(d&&d.s)Object.keys(d.s).forEach(k=>{const s=d.s[k];if(s.st!=='void'&&s.pays&&s.pays.some(p=>p.ref===ref))hit=s.no;});});
  return hit;
}
function bucketFor(date){
  let n=0;const ids=[];
  Object.keys(S.days).forEach(b=>{const d=S.days[b];if(d&&d.date===date){n+=d.s?Object.keys(d.s).length:0;ids.push(b);}});
  const idx=Math.floor(n/250);
  return idx?date+'~'+idx:date;
}
async function ensureDate(date){
  if(date>=cutoff()||S.extra[date]||S.loading[date])return;
  S.loading[date]=true;
  try{const rows=await DB.query('salesdays',['date','==',date]);S.extra[date]=toMap(rows);}
  catch(e){S.extra[date]={};console.error(e);}
  S.loading[date]=false;invalidate();
}
async function saveSale(sale){
  const b=bucketFor(sale.date);
  await serial('salesdays/'+b,async()=>{
    const cur=await retry(()=>DB.get('salesdays',b));
    if(cur)await retry(()=>DB.update('salesdays',b,clean({s:{[sale.id]:sale}})));
    else await retry(()=>DB.set('salesdays',b,clean({date:sale.date,s:{[sale.id]:sale}})));
    const chk=await retry(()=>DB.get('salesdays',b));
    if(!chk||!chk.s||!chk.s[sale.id])await retry(()=>DB.update('salesdays',b,clean({s:{[sale.id]:sale}})));
  });
}

/* ---- payments & checkout ---- */
function payState(T){
  const paid=r2(S.pay.list.reduce((a,p)=>a+p.a,0));
  return {paid,remaining:Math.max(0,r2(T.total-paid)),change:paid>T.total?r2(paid-T.total):0};
}
function openCheckout(){
  const T=totals();
  if(!T.count||T.total<=0){toast('Add something to sell first.');return;}
  if(!S.canEdit){
    const pct=T.gross>0?T.disc/T.gross*100:0;
    if(pct>(Number(S.settings.maxDisc)||0)+0.001){toast('Discounts above '+S.settings.maxDisc+'% need a manager. Lower the discount.','bad');return;}
  }
  S.pay={list:[],method:'cash',err:''};
  openModal({type:'checkout',title:'Take payment'});
}
function addPayment(){
  const T=totals(),P=payState(T),m=S.pay.method;
  const amt=num($('#pay-amt')&&$('#pay-amt').value);
  const refEl=$('#pay-ref');
  const ref=refEl?refEl.value.trim().toUpperCase().replace(/\s+/g,''):'';
  let err='';
  if(!(amt>0))err='Enter an amount greater than zero.';
  else if(m!=='cash'&&amt>P.remaining+0.001)err='That is more than the amount still due.';
  else if(m==='mpesa'){
    if(!/^[A-Z0-9]{10}$/.test(ref))err='M-Pesa codes have 10 letters and digits, like SJ41A2B3C4.';
    else if(S.pay.list.some(p=>p.ref===ref))err='That M-Pesa code is already on this sale.';
    else{const used=findRef(ref);if(used)err='That M-Pesa code is already on receipt '+used+'.';}
  }else if(m==='account'){
    const c=S.customers[S.cart.cust];
    const already=S.pay.list.filter(p=>p.m==='account').reduce((a,p)=>a+p.a,0);
    if(!c)err='Choose a customer on the sale first.';
    else if(amt+already>creditAvail(c)+0.001)err='Over the credit limit. Available: KSh '+money(creditAvail(c))+'.';
  }
  S.pay.err=err;
  if(!err)S.pay.list.push({m,a:r2(amt),ref});
  renderModal();
}
async function completeSale(){
  if(S.busy)return;
  const T=totals(),P=payState(T);
  if(P.remaining>0||!T.count)return;
  S.busy=true;renderModal();
  const now=new Date(),date=dkey(now);
  const cid=S.cart.cust,cust=cid?S.customers[cid]:null;
  const seq=salesOn(date).length+1;
  const sale={
    id:uid(),no:pad(now.getFullYear()%100)+pad(now.getMonth()+1)+pad(now.getDate())+'-'+String(seq).padStart(3,'0'),
    t:now.getTime(),date,cashier:S.cashier,cust:cust?cid:null,custName:cust?cust.name:'',
    lines:S.cart.lines.map(l=>({p:l.pid||null,n:l.name,u:l.unit,q:l.qty,pr:l.price,v:!!l.vat,c:l.cost||0})),
    gross:T.gross,disc:T.disc,total:T.total,vat:T.vat,vr:S.settings.vatOn?Number(S.settings.vatRate)||0:0,
    pays:S.pay.list.map(p=>({m:p.m,a:p.a,ref:p.ref||''})),change:P.change,st:'paid'
  };
  try{await saveSale(sale);}
  catch(e){S.busy=false;fail(e,'the sale');renderModal();return;}
  const problems=[];
  for(const l of sale.lines){
    if(!l.p||!S.products[l.p])continue;
    try{await W.update('products',l.p,{stock:r3(stockOf(S.products[l.p])-l.q)});}
    catch(e){problems.push(l.n);}
  }
  const acc=sale.pays.filter(p=>p.m==='account').reduce((a,p)=>a+p.a,0);
  if(acc>0&&cust){
    try{
      await W.update('customers',cid,{bal:r2((Number(S.customers[cid].bal)||0)+acc)});
      await W.set('acct',uid(),{cust:cid,t:sale.t,date,kind:'sale',amt:acc,ref:sale.no});
    }catch(e){problems.push('customer account');}
  }
  S.cart=newCart();S.cartOpen=false;S.busy=false;S.pay={list:[],method:'cash',err:''};
  openModal({type:'receipt',title:'Receipt',sale,fresh:true});
  render();
  if(problems.length)toast('Sale saved, but could not update: '+problems.join(', ')+'. Fix stock by hand.','bad');
}
async function voidSale(id){
  const s=findSale(id);
  if(!s||s.st==='void')return;
  try{await retry(()=>DB.update('salesdays',s._b,clean({s:{[id]:{st:'void',voidBy:S.cashier,voidAt:Date.now()}}})));}
  catch(e){fail(e,'the void');return;}
  const problems=[];
  for(const l of s.lines){
    if(!l.p||!S.products[l.p])continue;
    try{await W.update('products',l.p,{stock:r3(stockOf(S.products[l.p])+l.q)});}catch(e){problems.push(l.n);}
  }
  const acc=s.pays.filter(p=>p.m==='account').reduce((a,p)=>a+p.a,0);
  if(acc>0&&s.cust&&S.customers[s.cust]){
    try{
      await W.update('customers',s.cust,{bal:r2((Number(S.customers[s.cust].bal)||0)-acc)});
      await W.set('acct',uid(),{cust:s.cust,t:Date.now(),date:today(),kind:'void',amt:-acc,ref:s.no});
    }catch(e){problems.push('customer account');}
  }
  closeModal();
  toast(problems.length?'Voided, but could not update: '+problems.join(', ')+'.':'Receipt '+s.no+' voided. Stock restored.',problems.length?'bad':'');
}

/* ---- reports ---- */
function daySummary(date){
  const all=salesOn(date),sales=all.filter(s=>s.st!=='void');
  let total=0,vat=0,cost=0,disc=0;
  const by={cash:0,mpesa:0,card:0,account:0},items={};
  sales.forEach(s=>{
    total+=s.total;vat+=s.vat;disc+=s.disc;
    s.lines.forEach(l=>{
      cost+=(l.c||0)*l.q;
      const k=l.n;items[k]=items[k]||{n:l.n,u:l.u,q:0,a:0};items[k].q+=l.q;items[k].a+=l.q*l.pr;
    });
    s.pays.forEach(p=>{by[p.m]=(by[p.m]||0)+p.a;});
    by.cash-=s.change||0;
  });
  const recv={cash:0,mpesa:0,bank:0,cheque:0};
  Object.keys(S.acct).forEach(k=>{const a=S.acct[k];if(a.date===date&&a.kind==='payment'){recv[a.m]=(recv[a.m]||0)+(-a.amt);}});
  const top=Object.keys(items).map(k=>items[k]).sort((a,b)=>b.a-a.a).slice(0,5);
  return {count:sales.length,voids:all.length-sales.length,total:r2(total),vat:r2(vat),disc:r2(disc),margin:r2(total-vat-cost),by,recv,top,cashExpected:r2(by.cash+recv.cash)};
}

/* ---- receipt text ---- */
const RW=40;
const center=s=>{s=String(s);return ' '.repeat(Math.max(0,Math.floor((RW-s.length)/2)))+s;};
const lr=(a,b)=>{a=String(a);b=String(b);const g=RW-a.length-b.length;return g>0?a+' '.repeat(g)+b:a.slice(0,Math.max(0,RW-b.length-1))+' '+b;};
function wrap(s,w){
  w=w||RW;const out=[];let cur='';
  String(s).split(/\s+/).forEach(word=>{
    if(!word)return;
    if((cur+' '+word).trim().length>w){if(cur)out.push(cur);cur=word.slice(0,w);}
    else cur=(cur+' '+word).trim();
  });
  if(cur)out.push(cur);return out;
}
function receiptText(s){
  const st=S.settings,L=[],hr='-'.repeat(RW);
  wrap(st.name.toUpperCase()).forEach(x=>L.push(center(x)));
  if(st.address)wrap(st.address).forEach(x=>L.push(center(x)));
  if(st.phone)L.push(center('Tel '+st.phone));
  if(st.pin)L.push(center('KRA PIN '+st.pin));
  L.push(hr);
  L.push(lr('Receipt '+s.no,fmtDT(s.t)));
  L.push('Cashier: '+s.cashier);
  if(s.custName)L.push('Customer: '+s.custName);
  L.push(hr);
  s.lines.forEach(l=>{
    wrap(l.n).forEach(x=>L.push(x));
    L.push(lr('  '+qtyFmt(l.q)+' '+l.u+' x '+money(l.pr),money(r2(l.q*l.pr))));
  });
  L.push(hr);
  if(s.disc>0){L.push(lr('Subtotal',money(s.gross)));L.push(lr('Discount','-'+money(s.disc)));}
  L.push(lr('TOTAL KSh',money(s.total)));
  if(s.vat>0)L.push(lr('incl. VAT '+(s.vr||st.vatRate)+'%',money(s.vat)));
  L.push(hr);
  s.pays.forEach(p=>L.push(lr(PM[p.m]+(p.ref?' '+p.ref:''),money(p.a))));
  if(s.change>0)L.push(lr('Change',money(s.change)));
  if(s.st==='void'){L.push(hr);L.push(center('*** VOIDED ***'));}
  if(st.footer){L.push(hr);wrap(st.footer).forEach(x=>L.push(center(x)));}
  return L.join('\n');
}
function waNumber(p){
  let d=String(p||'').replace(/\D/g,'');
  if(!d)return '';
  if(d.startsWith('254'))return d;
  if(d.startsWith('0'))return '254'+d.slice(1);
  if(d.length===9)return '254'+d;
  return d;
}

/* ================= actions ================= */
function holdSale(){
  const T=totals();if(!T.count)return;
  const c=S.cart.cust?S.customers[S.cart.cust]:null;
  const id=uid();
  W.set('held',id,{t:Date.now(),label:c?c.name:'Walk-in',cust:S.cart.cust||'',by:S.cashier,disc:S.cart.disc,lines:S.cart.lines})
    .then(()=>toast('Sale held.')).catch(e=>fail(e,'the held sale'));
  S.cart=newCart();S.cartOpen=false;render();
}
function recall(id){
  const h=S.held[id];if(!h)return;
  if(S.cart.lines.length){toast('Hold or clear the current sale first.','bad');return;}
  S.cart={lines:h.lines.map(l=>Object.assign({},l)),cust:h.cust||'',disc:h.disc||{type:'amt',val:0}};
  W.del('held',id).catch(e=>fail(e,'the held sale'));
  closeModal();render();
}
async function loadSample(){
  toast('Loading sample catalogue…');

    }
    for(const c of SEED_CUST){if(!S.customers[c[0]])await W.set('customers',c[0],c[1]);}
    toast('Sample catalogue loaded.');
  }catch(e){fail(e,'the catalogue');}
}

const FORMS={
  pay(){addPayment();},
  product(f){
    const g=n=>f.elements[n].value.trim(),id=f.dataset.id;
    const err=m=>{$('#f-err').textContent=m;};
    const name=g('p-name'),price=num(g('p-price')),cost=num(g('p-cost')||0),stock=num(g('p-stock')||0),reorder=num(g('p-reorder')||0);
    const bq=num(g('p-bulkq')||0),bp=num(g('p-bulkp')||0),unit=g('p-unit');
    if(!name)return err('Enter a product name.');
    if(!(price>=0))return err('Enter a selling price.');
    if(!isFinite(cost)||cost<0)return err('Buying cost must be a number.');
    if(!isFinite(stock)||!isFinite(reorder))return err('Stock and reorder level must be numbers.');
    if((bq>0)!==(bp>0))return err('Set both the bulk quantity and the bulk price, or leave both empty.');
    if(bp>0&&bp>=price)return err('Bulk price should be lower than the normal price.');
    const sku=g('p-sku')||('P'+Date.now().toString(36).toUpperCase().slice(-5));
    if(plist().some(p=>p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==id))return err('Another product already uses that SKU.');
    const doc=Object.assign({},id?S.products[id]:{},{name,sku,barcode:g('p-barcode'),cat:g('p-cat')||'Other',unit,price:r2(price),cost:r2(cost),stock:isDec(unit)?r3(stock):Math.round(stock),reorder:Number(reorder)||0,bin:g('p-bin'),vat:f.elements['p-vat'].checked,bulkQty:bq>0?bq:0,bulkPrice:bp>0?r2(bp):0});
    W.set('products',id||uid(),doc).then(()=>{closeModal();toast('Product saved.');}).catch(e=>fail(e,'the product'));
  },
  recv(f){
    const id=f.dataset.id,p=S.products[id],err=m=>{$('#f-err').textContent=m;};
    const d=num(f.elements['r-qty'].value),c=num(f.elements['r-cost'].value);
    if(!isFinite(d)||d===0)return err('Enter how many to add, or a negative number to remove.');
    const ns=r3(stockOf(p)+d);
    if(d<0&&ns<0)return err('You cannot remove more than the '+qtyFmt(stockOf(p))+' in stock.');
    const upd={stock:ns,last:f.elements['r-why'].value+' '+(d>0?'+':'')+qtyFmt(d)+', '+new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short'})};
    if(c>=0&&isFinite(c)&&f.elements['r-cost'].value.trim())upd.cost=r2(c);
    W.update('products',id,upd).then(()=>{closeModal();toast('Stock updated.');}).catch(e=>fail(e,'stock'));
  },
  custom(f){
    const err=m=>{$('#f-err').textContent=m;};
    const name=f.elements['c-name'].value.trim(),price=num(f.elements['c-price'].value),qty=num(f.elements['c-qty'].value);
    if(!name)return err('Describe the item.');
    if(!(price>0))return err('Enter a price.');
    if(!(qty>0))return err('Enter a quantity.');
    const l={key:uid(),pid:null,name,unit:'pcs',qty:r3(qty),base:r2(price),price:r2(price),bulkQty:0,bulkPrice:0,vat:f.elements['c-vat'].checked,cost:0,custom:true};
    S.cart.lines.push(l);closeModal();render();
  },
  customer(f){
    const id=f.dataset.id,err=m=>{$('#f-err').textContent=m;};
    const name=f.elements['k-name'].value.trim(),limit=num(f.elements['k-limit'].value||0);
    if(!name)return err('Enter a name.');
    if(!isFinite(limit)||limit<0)return err('Credit limit must be zero or more.');
    const nid=id||uid(),old=id?S.customers[id]:{bal:0};
    const doc=Object.assign({},old,{name,phone:f.elements['k-phone'].value.trim(),type:f.elements['k-type'].value,limit:r2(limit),note:f.elements['k-note'].value.trim(),bal:Number(old.bal)||0});
    W.set('customers',nid,doc).then(()=>{if(!id&&f.dataset.from==='sell')S.cart.cust=nid;closeModal();render();toast('Customer saved.');}).catch(e=>fail(e,'the customer'));
  },
  acctpay(f){
    const id=f.dataset.id,c=S.customers[id],err=m=>{$('#f-err').textContent=m;};
    const amt=num(f.elements['a-amt'].value);
    if(!(amt>0))return err('Enter the amount received.');
    const m=f.elements['a-m'].value,ref=f.elements['a-ref'].value.trim();
    W.update('customers',id,{bal:r2((Number(c.bal)||0)-amt)})
      .then(()=>W.set('acct',uid(),{cust:id,t:Date.now(),date:today(),kind:'payment',amt:-r2(amt),m,ref}))
      .then(()=>{closeModal();toast('Payment recorded.');}).catch(e=>fail(e,'the payment'));
  },
  settings(f){
    const e=f.elements,rate=num(e.vatRate.value),md=num(e.maxDisc.value);
    if(!isFinite(rate)||rate<0||rate>100){toast('VAT rate must be between 0 and 100.','bad');return;}
    const doc={name:e.name.value.trim()||DEFAULTS.name,address:e.address.value.trim(),phone:e.phone.value.trim(),pin:e.pin.value.trim().toUpperCase(),footer:e.footer.value.trim(),vatOn:e.vatOn.checked,vatRate:rate,allowNeg:e.allowNeg.checked,maxDisc:isFinite(md)&&md>=0?md:DEFAULTS.maxDisc};
    W.set('settings','shop',doc).then(()=>toast('Settings saved.')).catch(x=>fail(x,'settings'));
  }
};

/* ================= toast ================= */
let toastTimer=0;
function toast(msg,kind){
  const t=$('#toast');t.textContent=msg;t.className='toast'+(kind==='bad'?' bad':'');t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>{t.hidden=true;},kind==='bad'?6000:3200);
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];
  if(fn){if(el.tagName==='A')return;fn(el);}
});
document.addEventListener('change',e=>{
  const el=e.target.closest('[data-ch]');
  if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el);
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;render();}
  else if(e.target.id==='sq'){S.sq=e.target.value;render();}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');
  if(!f)return;
  e.preventDefault();
  const fn=FORMS[f.dataset.form];if(fn)fn(f);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.modal&&!S.busy){closeModal();return;}
  if(e.key==='Enter'&&e.target.id==='q'){
    e.preventDefault();
    const q=S.q.trim().toLowerCase();if(!q)return;
    const all=plist();
    let hit=all.find(p=>p.sku.toLowerCase()===q||(p.barcode&&p.barcode.toLowerCase()===q));
    if(!hit){const m=all.filter(p=>(S.cat==='All'||(p.cat||'Other')===S.cat)&&matches(p,S.q));if(m.length===1)hit=m[0];}
    if(hit){S.q='';addToCart(hit.id);const i=$('#q');if(i)i.focus();}
    else toast('No single product matches “'+S.q+'”.');
  }
});

/* ================= boot ================= */
async function boot(){
  seedMem();connect(memDB,'connecting');render();
  const c=window.claude;
  if(!c||!c.use){S.status='demo';render();return;}
  let db=null;
  try{db=await c.use('db');}catch(e){}
  if(!db){S.status='demo';render();return;}
  try{const u=await c.use('user');if(u&&typeof u.canEdit==='function')S.canEdit=!!u.canEdit();}catch(e){}
  try{S.dl=await c.use('downloads');}catch(e){S.dl=null;}
  connect(realDB(db),'live');render();
}
boot();
})();
</script>
